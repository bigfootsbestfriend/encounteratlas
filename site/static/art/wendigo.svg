<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" version="1.1">
<!-- Wendigo as the Algonquian traditions describe it: a giant, starved human figure with skin pulled tight over the
     bones (Basil Johnston). No antlers or animal parts. Hand-drawn for Encounter Atlas. -->
<defs><mask id="ribs"><rect width="800" height="800" fill="#fff"/>
  <g fill="none" stroke="#000" stroke-linecap="round" stroke-width="7">
    <path d="M412 300 C432 292 452 292 470 300"/><path d="M406 326 C428 318 450 318 468 326"/>
    <path d="M402 352 C424 344 446 344 462 352"/><path d="M402 378 C420 372 438 372 452 378"/>
  </g></mask>
<mask id="eye"><rect width="800" height="800" fill="#fff"/><ellipse cx="538" cy="158" rx="9" ry="6" fill="#000" transform="rotate(15 538 158)"/></mask></defs>
<g fill="#14211B" stroke="#14211B" stroke-linecap="round" stroke-linejoin="round">
  <!-- torso: hunched back, hollow chest, sunken belly -->
  <path mask="url(#ribs)" d="M468 236 C440 226 404 232 384 256 C366 280 360 320 362 370 C364 412 370 446 380 474 L440 480 C446 452 452 420 462 396 C474 368 486 330 490 292 C492 266 486 246 468 236 Z" stroke-width="4"/>
  <!-- neck pushed forward -->
  <path d="M458 250 C478 240 496 232 512 226" fill="none" stroke-width="30"/>
  <!-- head: long skull hanging forward, open jaw -->
  <path mask="url(#eye)" d="M496 120 C516 106 546 112 558 138 C566 156 566 176 560 190 C552 198 548 206 550 216 C548 230 540 240 528 244 C514 246 502 238 496 226 C486 206 484 176 486 152 C487 138 490 128 496 120 Z" stroke-width="3"/>
  <!-- ragged hair hanging from the back of the skull -->
  <path d="M494 124 C478 152 470 192 468 244 M502 116 C488 150 482 196 484 252 M490 138 C472 164 460 200 452 236" fill="none" stroke-width="7"/>
  <!-- trailing arm: long and thin, hanging past the knee -->
  <path d="M392 262 C372 304 356 350 346 398" fill="none" stroke-width="24"/>
  <circle cx="345" cy="402" r="16"/>
  <path d="M344 404 C334 450 326 494 320 538" fill="none" stroke-width="17"/>
  <circle cx="319" cy="542" r="13"/>
  <path d="M318 544 C310 578 304 608 300 642 M322 546 C322 582 322 614 324 646 M314 546 C302 568 292 590 284 614 M325 544 C336 566 344 588 348 610" fill="none" stroke-width="8"/>
  <!-- reaching arm: stretched out in front, long hooked fingers -->
  <path d="M474 262 C498 300 520 336 540 372" fill="none" stroke-width="24"/>
  <circle cx="542" cy="376" r="16"/>
  <path d="M544 378 C570 398 596 414 622 428" fill="none" stroke-width="17"/>
  <circle cx="625" cy="430" r="13"/>
  <path d="M626 430 C656 432 682 440 704 456 M628 434 C654 446 674 462 690 482 M624 436 C644 456 656 476 664 500 M628 428 C654 420 678 420 700 428" fill="none" stroke-width="8"/>
  <!-- trailing leg, heel lifted -->
  <path d="M396 474 C380 520 362 562 346 604" fill="none" stroke-width="34"/>
  <circle cx="344" cy="608" r="20"/>
  <path d="M342 612 C330 660 318 704 306 742" fill="none" stroke-width="22"/>
  <path d="M308 738 C322 752 340 764 362 774 L330 778 C316 770 302 760 294 748 Z" stroke-width="10"/>
  <!-- leading leg, striding forward -->
  <path d="M428 474 C452 514 474 552 494 590" fill="none" stroke-width="34"/>
  <circle cx="497" cy="594" r="20"/>
  <path d="M498 598 C506 646 512 694 516 744" fill="none" stroke-width="22"/>
  <path d="M506 740 C520 760 548 770 590 774 L594 780 L508 780 C502 768 500 754 506 740 Z" stroke-width="8"/>
</g>
</svg>
