<svg viewBox="0 0 720 250" role="img" aria-labelledby="casting-steps-t" class="dg"><title id="casting-steps-t">Casting a track in four steps: clean and dam, mix in the bag, pour beside the print, wait and lift from below</title><defs><marker id="ah" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4D6157"/></marker><marker id="ahA" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7A4E00"/></marker></defs><rect width="720" height="250" fill="#F7F4EA" rx="6"/><ellipse cx="90" cy="104" rx="72" ry="54" fill="#E4DCC6"/><g class="dg-print dg-print-mud"><path d="M38 104C38 100.2 38.7 95.2 41.1 92.6C43.5 89.9 47.5 88.1 52.6 87.9C57.6 87.7 65 91.4 71.3 91.5C77.5 91.6 84.1 90.2 90 88.4C95.9 86.6 102.3 81.6 106.6 80.6C111 79.6 113.8 80 116 82.2C118.2 84.3 118.9 89.6 119.6 93.6C120.3 97.6 120.5 101.9 120.2 106.1C119.8 110.2 119.1 115.2 117.6 118.6C116 121.9 115.4 125.5 110.8 126.4C106.2 127.2 96.9 124.5 90 123.8C83.1 123 75.8 122.3 69.2 121.7C62.6 121.1 55.2 121.2 50.5 120.1C45.8 119.1 43.2 118.1 41.1 115.4C39 112.8 38 107.8 38 104Z"/><ellipse cx="125.2" cy="88.6" rx="6.9" ry="6" transform="rotate(0 125.2 88.6)"/><ellipse cx="126.8" cy="99.6" rx="4.6" ry="4.1" transform="rotate(0 126.8 99.6)"/><ellipse cx="126" cy="108.2" rx="4.2" ry="3.7" transform="rotate(0 126 108.2)"/><ellipse cx="123.5" cy="115.6" rx="3.7" ry="3.3" transform="rotate(0 123.5 115.6)"/><ellipse cx="119.5" cy="121.7" rx="3.3" ry="3" transform="rotate(0 119.5 121.7)"/></g><ellipse cx="90" cy="104" rx="66" ry="38" fill="none" stroke="#7A4E00" stroke-width="4"/><path d="M98 98l10 -5" stroke="#6E523B" stroke-width="3" stroke-linecap="round"/><path d="M104 92q10 -26 30 -36" fill="none" stroke="#4D6157" stroke-width="1.6" marker-end="url(#ah)"/><text x="140" y="54" class="dg-txt-s">twig out</text><text x="26" y="162" class="dg-txt-s">dam strip</text><circle cx="22" cy="28" r="13" fill="#13261F"/><text x="22" y="33" text-anchor="middle" class="dg-num">1</text><text x="90" y="196" text-anchor="middle" class="dg-txt-b">Clean and dam</text><text x="90" y="214" text-anchor="middle" class="dg-txt-s">Pick out loose debris, then</text><text x="90" y="228" text-anchor="middle" class="dg-txt-s">ring the print with a strip</text><path d="M180 30V200" stroke="#E2D8BE"/><path d="M238 56h76v86q0 8 -8 8h-60q-8 0 -8 -8Z" fill="#fff" stroke="#13261F" stroke-width="2"/><path d="M238 64h76" stroke="#13261F" stroke-width="1.5" stroke-dasharray="3 2"/><path d="M244 96q32 -8 64 0v40q0 6 -6 6h-52q-6 0 -6 -6Z" fill="#E6E1D4"/><text x="276" y="122" text-anchor="middle" class="dg-txt-s">powder</text><path d="M206 30l22 8l-4 12l-22 -8Z" fill="#4FB3A9" opacity=".9"/><path d="M228 44q12 2 16 18v26" fill="none" stroke="#4FB3A9" stroke-width="4" stroke-linecap="round"/><path d="M224 118a20 20 0 0 1 0 -26M328 92a20 20 0 0 1 0 26" fill="none" stroke="#7A4E00" stroke-width="2" marker-end="url(#ahA)"/><text x="252" y="46" class="dg-txt-s">water in</text><text x="326" y="134" class="dg-txt-s">knead</text><circle cx="202" cy="28" r="13" fill="#13261F"/><text x="202" y="33" text-anchor="middle" class="dg-num">2</text><text x="270" y="196" text-anchor="middle" class="dg-txt-b">Mix in the bag</text><text x="270" y="214" text-anchor="middle" class="dg-txt-s">Water into the powder; knead</text><text x="270" y="228" text-anchor="middle" class="dg-txt-s">to pancake batter</text><path d="M360 30V200" stroke="#E2D8BE"/><ellipse cx="450" cy="110" rx="72" ry="54" fill="#E4DCC6"/><g class="dg-print dg-print-mud"><path d="M398 110C398 106.2 398.7 101.2 401.1 98.6C403.5 95.9 407.5 94.1 412.6 93.9C417.6 93.7 425 97.4 431.3 97.5C437.5 97.6 444.1 96.2 450 94.4C455.9 92.6 462.3 87.6 466.6 86.6C471 85.6 473.8 86 476 88.2C478.2 90.3 478.9 95.6 479.6 99.6C480.3 103.6 480.5 107.9 480.2 112.1C479.8 116.2 479.1 121.2 477.6 124.6C476 127.9 475.4 131.5 470.8 132.4C466.2 133.2 456.9 130.5 450 129.8C443.1 129 435.8 128.3 429.2 127.7C422.6 127.1 415.2 127.2 410.5 126.1C405.8 125.1 403.2 124.1 401.1 121.4C399 118.8 398 113.8 398 110Z"/><ellipse cx="485.2" cy="94.6" rx="6.9" ry="6" transform="rotate(0 485.2 94.6)"/><ellipse cx="486.8" cy="105.6" rx="4.6" ry="4.1" transform="rotate(0 486.8 105.6)"/><ellipse cx="486" cy="114.2" rx="4.2" ry="3.7" transform="rotate(0 486 114.2)"/><ellipse cx="483.5" cy="121.6" rx="3.7" ry="3.3" transform="rotate(0 483.5 121.6)"/><ellipse cx="479.5" cy="127.7" rx="3.3" ry="3" transform="rotate(0 479.5 127.7)"/></g><ellipse cx="450" cy="110" rx="66" ry="38" fill="none" stroke="#7A4E00" stroke-width="4"/><path d="M410 110q24 -10 46 4q20 12 34 -2v12q-30 22 -80 -2Z" fill="#F1EEE6" opacity=".95"/><ellipse cx="398" cy="90" rx="13" ry="7" fill="#C9CED1" stroke="#13261F" stroke-width="1.5"/><path d="M386 88l-26 -14" stroke="#13261F" stroke-width="4" stroke-linecap="round"/><path d="M398 38q4 26 0 48" fill="none" stroke="#F1EEE6" stroke-width="7" stroke-linecap="round"/><path d="M398 38q4 26 0 48" fill="none" stroke="#B9B09A" stroke-width="1" stroke-linecap="round"/><path d="M410 94q16 2 22 12" fill="none" stroke="#4D6157" stroke-width="1.6" marker-end="url(#ah)"/><text x="406" y="34" class="dg-txt-s">pour low, onto a spoon</text><circle cx="382" cy="28" r="13" fill="#13261F"/><text x="382" y="33" text-anchor="middle" class="dg-num">3</text><text x="450" y="196" text-anchor="middle" class="dg-txt-b">Pour beside it</text><text x="450" y="214" text-anchor="middle" class="dg-txt-s">Over a spoon held low; fill</text><text x="450" y="228" text-anchor="middle" class="dg-txt-s">to 1 in thick</text><path d="M540 30V200" stroke="#E2D8BE"/><path d="M554 138H706V172H554Z" fill="#E4DCC6"/><path d="M572 138q58 26 116 0" fill="#CDBB98"/><path d="M570 100h120v14q-60 22 -120 0Z" fill="#F1EEE6" stroke="#B9B09A" stroke-width="2"/><path d="M560 144v-30" stroke="#7A4E00" stroke-width="2.5" marker-end="url(#ahA)"/><path d="M700 144v-30" stroke="#7A4E00" stroke-width="2.5" marker-end="url(#ahA)"/><text x="630" y="92" text-anchor="middle" class="dg-txt-s">knuckle tap: "tock" = ready</text><text x="630" y="164" text-anchor="middle" class="dg-txt-s">lift from below</text><circle cx="562" cy="28" r="13" fill="#13261F"/><text x="562" y="33" text-anchor="middle" class="dg-num">4</text><text x="630" y="196" text-anchor="middle" class="dg-txt-b">Wait, then lift</text><text x="630" y="214" text-anchor="middle" class="dg-txt-s">20–30 min until it goes</text><text x="630" y="228" text-anchor="middle" class="dg-txt-s">"tock"; lift from below</text></svg>