name: Refresh podcasts

# Weekly: re-collect the podcast directory (Apple's free iTunes API + each show's RSS), commit the data if it
# changed, then start a deploy. A push made with GITHUB_TOKEN doesn't trigger other workflows, so the deploy is
# started explicitly.
on:
  schedule:
    - cron: "41 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: podcasts
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # ~1,100 throttled iTunes calls (3 s apart) with no cache on the runner: about an hour, plus the audio lookups
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect podcasts
        run: python3 collector/podcasts.py
      - name: Find each episode's audio (show's own https enclosure, for the site's player)
        run: python3 tools/podcast_audio.py
      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- data/podcasts.json data/podcasts_episodes.json; then
            echo "changed=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/podcasts.json data/podcasts_episodes.json
          git commit -m "Weekly podcast refresh"
          git pull --rebase origin main  # main may have moved during the long collect
          git push
          echo "changed=1" >> "$GITHUB_OUTPUT"
      - name: Deploy
        if: steps.commit.outputs.changed == '1'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
