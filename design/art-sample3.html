<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@700&family=Public+Sans:wght@600&display=swap" rel="stylesheet">
<style>body{margin:0;background:#0B1813;font-family:"Public Sans";color:#9FB3A3;padding:24px}.row{display:grid;grid-template-columns:repeat(6,1fr);gap:18px;background:#13261F;border:1px solid #2B4A3D;border-radius:16px;padding:20px}
.cell{display:flex;flex-direction:column;align-items:center;gap:10px}.icons{display:flex;gap:10px;align-items:center}.cap{font-size:13px}h1{font:700 26px "Zilla Slab";color:#F3F1E4;margin:0 0 14px}</style></head><body>
<h1>New: AI-generated silhouettes (Google Gemini), traced to vector</h1><div class="row" id="r"></div><h1 style="margin-top:22px">For comparison: the free-pack silhouettes</h1><div class="row" id="r2"></div>
<script>
const SET=[['mothman','Mothman','night'],['chupacabra','Chupacabra','dusk'],['grey-alien','Grey alien','night'],['flatwoods-monster','Flatwoods Monster','night'],['skunk-ape','Skunk Ape','dusk'],['thunderbird','Thunderbird','dusk']];
const SET2=[['bigfoot','Bigfoot','dusk'],['dogman','Dogman','night'],['nessie','Loch Ness Monster','lake'],['yeti','Yeti','snow'],['jersey-devil','Jersey Devil','night']];
const SKY={dusk:['#E3A649','#B5532F'],night:['#3B4C6B','#1B2A3A'],lake:['#E8B04A','#C8693A'],snow:['#A9C3CF','#5C7A8C']};
const grey='<g fill="#14211B"><path d="M100 30C122 30 134 47 132 66C130 84 114 99 100 102C86 99 70 84 68 66C66 47 78 30 100 30Z"/><path d="M96 100H104V110H96Z"/><path d="M100 108C111 108 118 114 118 127L115 156L111 190L105 190L102 158L98 158L95 190L89 190L85 156L82 127C82 114 89 108 100 108Z"/><path d="M84 114C77 128 73 146 73 165L69 174L73 174L77 167C79 148 84 131 90 120Z"/><path d="M116 114C123 128 127 146 127 165L131 174L127 174L123 167C121 148 116 131 110 120Z"/></g><g fill="#0A0F0C"><path d="M77 63C84 56 96 59 98 70C94 77 84 77 77 63Z"/><path d="M123 63C116 56 104 59 102 70C106 77 116 77 123 63Z"/></g>';
const fig=(k,x,y,s)=>k==='grey'?`<g transform="translate(${x} ${y}) scale(${s/200})">${grey}</g>`:`<image href="art-src/${k}.svg" x="${x}" y="${y}" width="${s}" height="${s}"/>`;
let n=0;
function hero(k,t){const id='s'+(n++);const [a,b]=SKY[t];const ground=t==='lake'?'<rect y="160" width="200" height="40" fill="#2B4A55"/>':t==='snow'?'<path d="M0 170L40 140 70 160 110 128 150 158 200 136V200H0Z" fill="#E8EEF0"/>':'<path d="M0 182L14 146 28 182 40 138 54 182 146 182 160 132 174 182 188 142 200 182V200H0Z" fill="#1E3A2F"/>';
 return `<svg viewBox="0 0 200 200" width="230"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient><clipPath id="c${id}"><rect x="6" y="6" width="188" height="188" rx="10"/></clipPath></defs><g clip-path="url(#c${id})"><rect width="200" height="200" fill="url(#${id})"/><circle cx="150" cy="52" r="24" fill="#F3E3B8" opacity=".9"/><path d="M0 152L30 120 55 138 85 104 120 134 150 110 200 142V200H0Z" fill="#5E4A3A" opacity=".5"/>${ground}${fig(k,22,k==="nessie"?34:26,160)}</g><rect x="6" y="6" width="188" height="188" rx="10" fill="none" stroke="#F3E3B8" stroke-width="4"/></svg>`}
const icon=(k,s)=>`<svg viewBox="0 0 200 200" width="${s}"><rect width="200" height="200" rx="40" fill="#1E3A2F"/><circle cx="100" cy="100" r="88" fill="#C8693A"/>${fig(k,22,20,156)}</svg>`;
const cells=(L)=>L.map(([k,name,t])=>`<div class="cell">${hero(k,t)}<div class="icons">${icon(k,48)}${icon(k,32)}${icon(k,20)}</div><div class="cap">${name}</div></div>`).join('');
document.getElementById('r').innerHTML=cells(SET);document.getElementById('r2').innerHTML=cells(SET2);
</script></body></html>
